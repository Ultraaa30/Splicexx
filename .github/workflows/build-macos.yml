name: Build macOS

# Manual build of Splicexx for macOS. The app is ad-hoc signed (no Apple
# certificate), so the bundle is sealed and is not reported as damaged. The
# first launch still needs a one-time approval in System Settings. Uploads the
# bundles as an artifact only; it does not create a GitHub release.
on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app bundles
        run: pnpm tauri build

      - name: Check the bundle is sealed
        run: |
          APP=src-tauri/target/release/bundle/macos/Splicexx.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP"

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: splicexx-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
